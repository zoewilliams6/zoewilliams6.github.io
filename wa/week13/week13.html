<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Finder</title>
  <link rel="stylesheet" href="https://use.typekit.net/wgl2klx.css" />
  <link rel="stylesheet" href="week13.css" />
</head>
<body>
  <div class="app">
    <header class="top-nav">
      <div class="logo">MOVIE FINDER</div>
      <div id="js-saved-pref" class="saved-pref">No saved genre yet</div>
    </header>
    <main>
      <section class="controls-section">
        <div class="controls-left">
          <label for="js-genre-select" class="topic-label">Choose a genre:</label>
          <select id="js-genre-select" class="topic-select">
            <option value="action">Action</option>
            <option value="comedy">Comedy</option>
            <option value="drama">Drama</option>
            <option value="romance">Romance</option>
            <option value="thriller">Thriller</option>
            <option value="horror">Horror</option>
            <option value="animation">Animation</option>
            <option value="documentary">Documentary</option>
          </select>
        </div>
        <div class="controls-right">
          <button id="js-get-movies" class="button generate-btn">Generate Movies</button>
          <button id="js-save-pref" class="button save-btn">Save My Preference</button>
          <button id="js-clear-data" class="button clear-btn">Clear Saved Data</button>
        </div>
      </section>
      <section class="status-bar">
        <p id="js-status-text" aria-live="polite">
          Select a genre and click “Generate Movies.”
        </p>
      </section>
      <section class="movie-row">
        <h2 id="row-title"></h2>
        <div class="row-scroll" id="movie-list"></div>
      </section>
      <template id="movie-card-template">
        <article class="movie-card">
          <div class="poster-wrapper">
            <img class="movie-poster" alt="">
          </div>
          <div class="movie-card-body">
            <h3 class="movie-title"></h3>
            <p class="movie-year"></p>
          </div>
        </article>
      </template>
    </main>
    <footer class="transparency-footer">
      <p>This interface recommends movies only based on the genre you selected.
        No hidden algorithm, no engagement optimization, and no behavioral tracking. </p>
    </footer>
  </div>
  <script src="week13.js"></script>
</body>
</html>
