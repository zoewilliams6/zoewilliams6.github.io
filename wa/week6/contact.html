<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://use.typekit.net/wgl2klx.css">
  <link rel="stylesheet" href="week6.css">
</head>
<body>

  <!-- Nav -->

  <nav class="main-nav">
    <div class="nav-brand">Community Hub</div>
    <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span class="hamburger"></span>
      <span class="hamburger"></span>
      <span class="hamburger"></span>
    </button>
    <ul class="nav-menu hide">
      <li><a href="week6.html">Home</a></li>

      <li><a href="contact.html">Contact</a></li>

       <!-- Contact Page Grid Layout -->

  <main class="contact-page">
    <section class="contact-info">
      <h1>Contact Support</h1>
      <p>If you have questions or need help, fill out the form below and we'll get back to you as soon as possible.</p>
    </section>

    <section class="contact-form-section">
      <form id="contact-form">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Your Name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="you@example.com"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" placeholder="Write your message here..." rows="5"></textarea><br><br>

        <button type="submit">Send Message</button>
      </form>
    </section>

    <footer class="footer">
      <p>2025 Community Hub. Contact Section.</p>
    </footer>
  </main>

   <script src="week6.js"></script>
</body>
</html>
