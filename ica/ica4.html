<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="https://use.typekit.net/wgl2klx.css">

  <style>
    html {
      font-family: "raleway-v20-deprecated", sans-serif;
        font-weight: 400;
        font-style: normal;

   /* font-family: "sofia-pro", sans-serif;
        font-weight: 400;
        font-style: normal; */
    }

    :root {
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --space-5: 48px;
}

    #box1 { background: #D3D7CB; color: #000; }
    #box2 { background: #7796CB; color: #000; }
    #box3 { background: #3D3A4B; color: #fff; }
    #box4 { background: #F1B5CB; color: #000; }
    #box5 { background: #ECAAF3; color: #000; }

    button {
  font-size: 16px;
  border-radius: 4px;
  background-color: #ECAAF3;
  color: #fff;
  cursor: pointer;
}
button:hover {
  background-color: #7796CB;
}
button:focus {
  outline: 2px solid #3D3A4B;
}


    h1 { font-size: 32px; }
    h2 { font-size: 25px; }
    h3 { font-size: 20px; }
    h4 { font-size: 16px; }
    p  { font-size: 16px; }
    .small-text { font-size: 12px; }

    a:hover {
      text-decoration: underline;
      color: #7796CB;
    }
    a:visited { color: #ECAAF3; }

    .color-box {
      width: 100px;
      height: 100px;
      display: inline-block;
    }

  </style>
</head>
<body>
    
  <div class="color-box"  id="box1">#D3D7CB ratio: 14.35:1 </div>
  <div class="color-box"  id="box2">#7796CB ratio: 7:1 </div>
  <div class="color-box" id="box3">#3D3A4B raio: 11.02:1 </div>
  <div class="color-box" id="box4">#F1B5CB ratio: 12.21:1 </div>
  <div class="color-box" id="box5">#ECAAF3 ratio: 11.61:1 </div>

  <h1>This is a heading 1</h1>
  <h2>This is a heading 2</h2>
  <h3>This is a heading 3</h3>
  <h4>This is a heading 4</h4>

  <p>This is paragraph text</p>
  <p class="small-text">This is small text</p>

  <button>Submit</button>

  <a href="#">This is a link</a>
</body>
</html>
